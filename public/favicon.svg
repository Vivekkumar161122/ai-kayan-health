  <path d="M50 16 L77 27 V50 C77 67 50 83 50 83 C50 83 23 67 23 50 V27 Z" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
